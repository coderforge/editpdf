[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "editpdf"
version = "1.0.0"
description = "Merge, split and rotate PDF documents, as a Cloud Builder Function."
license = "MIT"
requires-python = ">=3.10"
# Pure Python only: the function's package must run wherever the platform runs it.
dependencies = ["pypdf==6.21.1"]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "ruff==0.17.1", "pyyaml==6.0.3"]

[project.scripts]
editpdf-server = "editpdf.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py310"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PL", "PT", "RET", "C4", "PIE", "PTH"]
ignore = ["PLR2004", "PLR0911", "PLR0912", "PLR0913", "PLW0603", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
# Expected values (headers, events, multipart bodies) read best on one line.
"tests/*" = ["E501"]
